<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="leiloame.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>404 - Página Não Encontrada</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #e5e5e5;
      color: #333;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      @media screen and (max-width: 768px) {
        font-size: 1rem; 
      }
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 30px;

        @media screen and (max-width: 768px) {
            font-size: 0.8rem; 
        }
    }
    a {
      display: inline-block;
      padding: 10px 20px;
      font-size: 1rem;
      color: #fff;
      background-color: #17AC9D;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;

        @media screen and (max-width: 768px) {
            font-size: 0.8rem; 
        }
    }
    a:hover {
      background-color: #1dc0b0
    }

    img {
      width: 200px;
      height: 200px;

        @media screen and (max-width: 768px) {
            width: 100px;
            height: 100px;
        }
    }
  </style>
</head>
<body>
    <img src="erro404.png" alt="Leiloa-me" />
    <h1>404 - Página Não Encontrada</h1>
  <p>Ops! A página que você está procurando não existe.</p>
  <a href="/">Voltar para a Página Inicial</a>
</body>
</html>
